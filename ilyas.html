<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilyas sin dating coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1a1a1a;
      --cream: #faf6f0;
      --accent: #c4593e;
      --gold: #b8944f;
      --surface: #f0ebe3;
      --border: #ddd6cc;
      --cell-ladder-bg: #e8f5e9;
      --cell-ladder-border: #66bb6a;
      --cell-snake-bg: #fce4ec;
      --cell-snake-border: #ef9a9a;
      --cell-finish-bg: #fff3e0;
      --cell-active-bg: #fff9c4;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--cream);
      color: var(--ink);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem 6rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.8rem, 5vw, 3rem);
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .ingress {
      font-size: 1.1rem;
      color: var(--gold);
      font-style: italic;
    }

    #game-area {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 4px;
      width: 100%;
      max-width: 540px;
      background: var(--border);
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .cell {
      background: var(--surface);
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: clamp(0.55rem, 1.5vw, 0.75rem);
      text-align: center;
      padding: 4px;
      position: relative;
      cursor: default;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .cell .cell-num {
      font-size: 0.6rem;
      color: var(--gold);
      font-weight: 600;
      position: absolute;
      top: 3px;
      left: 5px;
    }

    .cell .cell-icon { font-size: 1.1rem; }

    .cell.ladder { background: var(--cell-ladder-bg); border: 2px solid var(--cell-ladder-border); }
    .cell.snake  { background: var(--cell-snake-bg);  border: 2px solid var(--cell-snake-border); }
    .cell.finish { background: var(--cell-finish-bg); border: 2px solid var(--gold); }
    .cell.active { background: var(--cell-active-bg); }

    .player-piece {
      font-size: 1.3rem;
      position: absolute;
    }

    #controls {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.8rem;
    }

    #status-msg {
      font-size: 1rem;
      max-width: 400px;
      min-height: 2.5rem;
      color: var(--ink);
      background: var(--surface);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      border: 1px solid var(--border);
    }

    #roll-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.8rem 2rem;
      font-family: 'Outfit', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    #roll-btn:hover  { opacity: 0.88; }
    #roll-btn:active { transform: scale(0.97); }
    #roll-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    #dice-display {
      font-size: 2.5rem;
      min-height: 3rem;
    }

    #coach-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--gold);
      color: white;
      border: none;
      border-radius: 50px;
      padding: 0.8rem 1.4rem;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0,0,0,0.18);
      z-index: 100;
      transition: opacity 0.2s;
    }
    #coach-btn:hover { opacity: 0.88; }

    #chat-modal {
      position: fixed;
      bottom: 5rem;
      right: 1.5rem;
      width: min(380px, calc(100vw - 2rem));
      z-index: 200;
    }
    #chat-modal.hidden { display: none; }

    #chat-box {
      background: var(--cream);
      border: 1.5px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      max-height: 420px;
    }

    #close-chat {
      align-self: flex-end;
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 0.6rem 0.8rem;
      color: var(--ink);
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      min-height: 180px;
    }

    .chat-bubble {
      max-width: 85%;
      padding: 0.6rem 0.9rem;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .chat-bubble.user {
      align-self: flex-end;
      background: var(--accent);
      color: white;
      border-bottom-right-radius: 4px;
    }
    .chat-bubble.coach {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    #chat-input-area {
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem;
      border-top: 1px solid var(--border);
    }

    #chat-input {
      flex: 1;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem 0.75rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      background: var(--cream);
    }
    #chat-input:focus { outline: 2px solid var(--gold); }

    #send-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1rem;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ilyas sin dating coach</h1>
    <p class="ingress">Klar for å finna kjærleiken? Me veit allereie svaret.</p>
  </header>
  <main>
    <div id="game-area">
      <div id="board"></div>
      <div id="controls">
        <div id="status-msg" role="status" aria-live="polite">Trykk på terningen for å starta!</div>
        <button id="roll-btn">🎲 Kast terning</button>
        <div id="dice-display"></div>
      </div>
    </div>
  </main>
  <button id="coach-btn">Spør coachen 🎙️</button>
  <div id="chat-modal" class="hidden">
    <div id="chat-box">
      <button id="close-chat" aria-label="Lukk chat">✕</button>
      <div id="chat-messages"></div>
      <div id="chat-input-area">
        <input id="chat-input" type="text" placeholder="Spør coachen...">
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>
  <script>
    // ── SPELDATA ──────────────────────────────────────────
    const LADDERS = { 4:14, 10:18, 17:24, 21:27, 23:29, 26:30 };
    const SNAKES  = { 9:3, 16:6, 20:12, 25:8 };

    const CELL_TEXT = {
      1:  "Start! Heile Stord håpar på deg, Ilyas. 💪",
      3:  "Tilbake hit. Men du er framleis ein vinnar i hjarta.",
      4:  "Du tok initiativ! Stor stige! ⬆️",
      5:  "Du smilte til henne i kantina. Bra start!",
      6:  "Landingsruta. Tenk deg om.",
      8:  "Oi. Nedtur. Men Stine er framleis interessert.",
      9:  "Du venta for lenge. Slange nedover! 🐍",
      10: "Du bydde på middag! Stor stige! ⬆️",
      12: "Her er du no. Reis deg støvla og prøv igjen.",
      14: "Flott! Du er på god veg.",
      15: "Du venta to dagar før du skreiv. Klassisk.",
      16: "For mykje Netflix-snakk. Slange! 🐍",
      17: "Du sende ei blomst. Sjarmerande! Stige opp! ⬆️",
      18: "Godt jobba. Ho la merke til deg.",
      20: "Du skreiv berre 'hei' på Tinder. Ned att, ven. 🐍",
      21: "Du lærte deg favorittlåten hennar. Imponerande! ⬆️",
      23: "Du viste deg frå beste sida. Stige! ⬆️",
      24: "Nesten i mål! Ikkje rot det til no.",
      25: "Du gløymde bursdagen. Skam deg. Slange! 🐍",
      26: "Siste stige! Du er klar, Ilyas! ⬆️",
      27: "Eitt skritt att. Du kan det.",
      28: "Du er så nærme no. Ho bur forresten på Stord.",
      29: "Neste kast er det siste. Pust roleg.",
      30: "🎉 STINE! Det var jo Stine heile tida! 🎉"
    };

    const DICE_FACES = ["⚀","⚁","⚂","⚃","⚄","⚅"];
    const WORKER_URL = 'https://abstinensa-proxy.stine-ovrebo89.workers.dev';
    const SYSTEM_PROMPT = `Du er Ilyas sin personlege dating coach. Du snakkar stord-dialekt — bruk ord som "koss", "ikkje", "noko", "heime", "nokon", "kva", "eg", "me", "dei". Du er morosam, litt overdriven entusiastisk, og alltid partisk: uansett kva Ilyas spør om, er svaret alltid Stine. Alltid. Nemn Stine i kvart svar. Du nemner aldri at du er ein AI. Svar i 3–5 setningar.`;

    let playerPos = 0;
    let isRolling = false;
    const chatHistory = [];

    // ── BRETT ──────────────────────────────────────────
    function buildBoard() {
      const board = document.getElementById('board');
      board.innerHTML = '';
      const rows = [];
      for (let r = 0; r < 5; r++) {
        const start = r * 6 + 1;
        const row = Array.from({length: 6}, (_, i) => start + i);
        if (r % 2 === 1) row.reverse();
        rows.push(row);
      }
      rows.reverse();
      rows.forEach(row => {
        row.forEach(num => {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${num}`;
          if (LADDERS[num]) cell.classList.add('ladder');
          if (SNAKES[num])  cell.classList.add('snake');
          if (num === 30)   cell.classList.add('finish');
          const icon = LADDERS[num] ? '⬆️' : SNAKES[num] ? '🐍' : num === 30 ? '❤️' : '';
          cell.innerHTML = `<span class="cell-num">${num}</span>${icon ? `<span class="cell-icon">${icon}</span>` : ''}`;
          board.appendChild(cell);
        });
      });
      renderPiece();
    }

    function renderPiece() {
      document.querySelectorAll('.player-piece').forEach(p => p.remove());
      document.querySelectorAll('.cell.active').forEach(c => c.classList.remove('active'));
      if (playerPos === 0) return;
      const cell = document.getElementById(`cell-${playerPos}`);
      if (!cell) return;
      cell.classList.add('active');
      const piece = document.createElement('span');
      piece.className = 'player-piece';
      piece.textContent = '🕺';
      cell.appendChild(piece);
    }

    // ── TERNINGKAST ────────────────────────────────────
    async function rollDice() {
      if (isRolling) return;
      isRolling = true;
      const rollBtn = document.getElementById('roll-btn');
      const diceDisplay = document.getElementById('dice-display');
      const statusMsg = document.getElementById('status-msg');
      rollBtn.disabled = true;

      let ticks = 0;
      const anim = setInterval(() => {
        diceDisplay.textContent = DICE_FACES[Math.floor(Math.random() * 6)];
        if (++ticks >= 10) clearInterval(anim);
      }, 80);

      await delay(900);
      const roll = Math.floor(Math.random() * 6) + 1;
      diceDisplay.textContent = DICE_FACES[roll - 1];

      playerPos = Math.min(playerPos + roll, 30);
      renderPiece();
      statusMsg.textContent = `Du kasta ${roll}! → Rute ${playerPos}. ${CELL_TEXT[playerPos] || 'Du held fram.'}`;

      await delay(800);

      let coachContext = null;

      if (LADDERS[playerPos]) {
        const dest = LADDERS[playerPos];
        statusMsg.textContent = `🪜 STIGE! Rute ${playerPos} → ${dest}! ${CELL_TEXT[playerPos]}`;
        await delay(1000);
        playerPos = dest;
        renderPiece();
        coachContext = "spelaren landa på ei stige og gjekk oppover. Gratulér entusiastisk og minn om at Stine er grunnen til at han er på veg opp.";
      } else if (SNAKES[playerPos]) {
        const dest = SNAKES[playerPos];
        statusMsg.textContent = `🐍 SLANGE! Rute ${playerPos} → ${dest}! ${CELL_TEXT[playerPos]}`;
        await delay(1000);
        playerPos = dest;
        renderPiece();
        coachContext = "spelaren landa på ei slange og gjekk nedover. Oppmuntre han og sei at Stine ventar på han uansett.";
      }

      if (playerPos === 30) {
        statusMsg.textContent = "🎉 DU VANN! STINE ER SVARET! Det var jo openbert heile tida, Ilyas!";
        rollBtn.textContent = "🔄 Spel igjen";
        rollBtn.disabled = false;
        rollBtn.onclick = restartGame;
        isRolling = false;
        return;
      }

      if (coachContext) {
        await delay(1000);
        await autoCoachComment(coachContext);
      }

      rollBtn.disabled = false;
      isRolling = false;
    }

    function restartGame() {
      playerPos = 0;
      isRolling = false;
      const rollBtn = document.getElementById('roll-btn');
      rollBtn.textContent = '🎲 Kast terning';
      rollBtn.onclick = null;
      rollBtn.disabled = false;
      document.getElementById('dice-display').textContent = '';
      document.getElementById('status-msg').textContent = 'Trykk på terningen for å starta!';
      buildBoard();
    }

    function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

    // ── CHATBOT ────────────────────────────────────────
    async function callCoach(messages) {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-6',
          max_tokens: 300,
          system: SYSTEM_PROMPT,
          messages
        })
      });
      const data = await res.json();
      return data.content?.[0]?.text ?? 'Noko gjekk gale. Prøv igjen!';
    }

    async function autoCoachComment(context) {
      try {
        const reply = await callCoach([{ role: 'user', content: `Gi ein kort kommentar: ${context}` }]);
        const statusMsg = document.getElementById('status-msg');
        statusMsg.textContent += ` 💬 Coach: "${reply}"`;
      } catch (_) {}
    }

    function addBubble(role, text) {
      const msgs = document.getElementById('chat-messages');
      const bubble = document.createElement('div');
      bubble.className = `chat-bubble ${role}`;
      bubble.textContent = text;
      msgs.appendChild(bubble);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function openChat() {
      document.getElementById('chat-modal').classList.remove('hidden');
      document.getElementById('chat-input').focus();
      if (chatHistory.length === 0) {
        addBubble('coach', 'Hei Ilyas! Eg er coachen din. Kva lurer du på om kjærleiken? 😄');
      }
    }

    function closeChat() {
      document.getElementById('chat-modal').classList.add('hidden');
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addBubble('user', text);
      chatHistory.push({ role: 'user', content: text });
      document.getElementById('send-btn').disabled = true;
      addBubble('coach', '...');
      try {
        const reply = await callCoach(chatHistory);
        document.getElementById('chat-messages').lastChild.remove();
        addBubble('coach', reply);
        chatHistory.push({ role: 'assistant', content: reply });
      } catch (_) {
        document.getElementById('chat-messages').lastChild.remove();
        addBubble('coach', 'Oisann, noko gjekk gale. Prøv igjen litt seinare!');
      }
      document.getElementById('send-btn').disabled = false;
    }

    // ── INIT ──────────────────────────────────────────
    document.getElementById('roll-btn').addEventListener('click', rollDice);
    document.getElementById('coach-btn').addEventListener('click', openChat);
    document.getElementById('close-chat').addEventListener('click', closeChat);
    document.getElementById('send-btn').addEventListener('click', sendMessage);
    document.getElementById('chat-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });
    buildBoard();
  </script>
</body>
</html>
